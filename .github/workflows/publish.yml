name: Publish npm release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'MrAlony/opencode-optimised-toolings'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use a trusted-publishing capable npm CLI
        run: |
          npm install --global npm@11.12.1
          node --version
          npm --version
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Verify tag and package versions agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Install package dependencies
        run: npm ci --ignore-scripts

      - name: Build generated runtime assets
        run: npm run build

      - name: Verify the runtime-only tarball
        shell: bash
        run: |
          npm pack --dry-run
          test -f packages/cbm/dist/index.js
          test "$(git status --porcelain --untracked-files=no)" = ""

      - name: Publish through npm trusted publishing
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish --access public
